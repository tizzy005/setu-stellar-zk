name: site-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The site has no npm dependencies today; the install step is kept so the
      # job stays correct if dependencies are added later.
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Run site smoke check
        run: npm run smoke
